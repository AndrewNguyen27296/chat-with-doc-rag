# Theme for the client-facing demo. Pinned to Dark Mode for high contrast and executive polish.
[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#131d31"
textColor = "#f8fafc"
font = "sans serif"

[server]
# The sample handbooks ship with the repo; nobody uploads anything.
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
